[package]
name = "scriv"
version = "0.3.0"
edition = "2024"
description = "Provides fuzzy-completion for various local and remote resources."
license = "MIT"
repository = "https://github.com/joakimen/scriv"
exclude = ["docs/", "demo/", ".github/", ".claude/", "prek.toml", "mise.toml"]

# Config for `make release` / `make release-tag` (cargo-release). scriv ships as
# GitHub release binaries (.github/workflows/release.yml), never to crates.io,
# so publishing is off as a guardrail. The pushed tag is the whole release
# trigger, named to match the `v*` that workflow listens for; releasing is
# restricted to `main`, the branch the tag must sit on.
[package.metadata.release]
publish = false
tag-name = "v{{version}}"
tag-message = "Release v{{version}}"
allow-branch = ["main"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4.6.7"
ignore = "0.4.31"
indexmap = { version = "2.14.0", features = ["serde"] }
# A type dependency, not a TUI: `SkimItem::display` returns a
# `ratatui::text::Line`, so this must match the version skim was built against.
ratatui ={ version = "0.30", default-features = false }
rustix = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skim = { version = "5", default-features = false }
time = { version = "0.3", features = ["local-offset"] }
toml = { version = "1.1.3", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3"
unicode-width = "0.2"

[profile.release]
strip = true
# Thin rather than fat. Fat LTO is a single serial optimisation pass over the
# whole program: measured here it costs 31s against thin's 11s on every `make`
# — the gate CI runs too — and buys 1.1MB of binary. The cross-crate inlining
# it adds is not measurable in a binary whose runtime is spent spawning git and
# gh and waiting on a selection.
lto = "thin"

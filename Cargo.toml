[package]
name = "scriv"
version = "0.5.0"
edition = "2024"
description = "Provides fuzzy-completion for various local and remote resources."
license = "MIT"
repository = "https://github.com/joakimen/scriv"
exclude = ["docs/", "demo/", ".github/", ".claude/", "prek.toml", "mise.toml"]

# Config for cargo-release, which writes the version, the tag and the push.
# Pushing the tag is what starts a release — see dist-workspace.toml — so the
# tag name here is the contract dist reads. scriv ships as GitHub release
# binaries, never to crates.io.
#
# The bump itself is an ordinary pull request, so `cargo release version` and
# `cargo release replace` run on the branch carrying it; only the tag is cut
# from `main`.
[package.metadata.release]
publish = false
tag-name = "v{{version}}"
allow-branch = ["main", "release/*"]
# `cargo release replace` dates the `## Unreleased` heading with the version
# just written, so the bump pull request carries the changelog entry rather than
# leaving it for a second one. dist reads that section back out as the body of
# the GitHub release, which is the only reason the file is machine-read at all.
#
# A sub-table rather than an inline one, which TOML 1.0 will not let span lines.
# It is last in this section for the same reason: every key after it would
# belong to it.
[[package.metadata.release.pre-release-replacements]]
file = "CHANGELOG.md"
search = "## Unreleased\n"
replace = "## Unreleased\n\n## {{version}} - {{date}}\n"
exactly = 1

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4.6.7"
ignore = "0.4.31"
indexmap = { version = "2.14.0", features = ["serde"] }
# A type dependency, not a TUI: `SkimItem::display` returns a
# `ratatui::text::Line`, so this must match the version skim was built against.
ratatui ={ version = "0.30", default-features = false }
rustix = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skim = { version = "5", default-features = false }
time = { version = "0.3", features = ["local-offset"] }
toml = { version = "1.1.3", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3"
unicode-width = "0.2"

[profile.release]
strip = true
# Thin rather than fat. Fat LTO is a single serial optimisation pass over the
# whole program: measured here it costs 31s against thin's 11s on every `make`
# — the gate CI runs too — and buys 1.1MB of binary. The cross-crate inlining
# it adds is not measurable in a binary whose runtime is spent spawning git and
# gh and waiting on a selection.
lto = "thin"

# The profile dist builds releases with. It exists only because dist requires a
# profile of its own; the settings that matter are all above.
[profile.dist]
inherits = "release"

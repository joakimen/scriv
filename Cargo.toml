[package]
name = "scriv"
version = "0.1.0"
edition = "2024"
description = "scriv discovers Git repositories and tracks the files you visit often."
license = "MIT"
repository = "https://github.com/joakimen/scriv"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4.6.7"
dirs = "6"
ignore = "0.4.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Library use only — skip the `cli`, `image`, and `listen` features and the
# heavy deps (image stack, IPC server, duplicate clap) they pull in.
skim = { version = "5", default-features = false }
toml = "1.1.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true

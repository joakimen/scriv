[package]
name = "scriv"
version = "0.1.0"
edition = "2024"
description = "scriv is a tool for discovering Git repositories."
license = "MIT"
repository = "https://github.com/joakimen/scriv"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true

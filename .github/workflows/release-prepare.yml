# Step 1 of releasing: bump the version and open the pull request that carries
# it. Step 2 is `release.yml`, dispatched once this lands on `main`.
#
# Nothing here runs on a maintainer's machine, which is the point. A release
# built from a laptop is a release whose inputs nobody else can see; running it
# as a workflow leaves the level, the resolved version and the operator in the
# Actions log.
name: release-prepare

on:
  workflow_dispatch:
    inputs:
      level:
        description: "How far to bump the version"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: "Exact version, overriding the level above"
        required: false
        type: string

permissions: {}

jobs:
  prepare:
    # A fork dispatching this would open a pull request against its own copy
    # with credentials it does not have.
    if: github.repository == 'joakimen/scriv'
    # Linux, though scriv only builds for Apple Silicon: cargo-release edits
    # manifests and never compiles the crate. Anything added here that does
    # compile it belongs on `macos-latest` instead, or it will hit the target
    # guard in `src/proc.rs`.
    runs-on: ubuntu-latest
    steps:
      # RELEASE_TOKEN, not GITHUB_TOKEN: GitHub runs no workflows on a pull
      # request opened by GITHUB_TOKEN, and the `main` ruleset requires the
      # `build` and `demo` checks on the branch tip. The bump would arrive
      # unmergeable, with no check ever scheduled to satisfy it.
      - name: Check the release token is present
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          test -n "$RELEASE_TOKEN" || {
            echo "RELEASE_TOKEN is unset. It needs contents:write and" >&2
            echo "pull-requests:write on this repository." >&2
            exit 1
          }

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          # cargo-release refuses to run against a shallow history, and the
          # push below needs a real branch to build on.
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      # mise.toml pins cargo-release. Installing it any other way would put a
      # second version of the tool in the release path.
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Bump the version
        env:
          LEVEL: ${{ inputs.level }}
          VERSION: ${{ inputs.version }}
        run: cargo release version "${VERSION:-$LEVEL}" --execute --no-confirm

      - name: Open the release pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -eu
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "release-v$ver"
          git commit -am "Release v$ver"
          git push -u origin "release-v$ver"
          gh pr create \
            --title "Release v$ver" \
            --body "Bump the version to $ver.

          Merge this, then dispatch \`release\` with the tag \`v$ver\`."
          echo "::notice::Opened the release pull request for v$ver"

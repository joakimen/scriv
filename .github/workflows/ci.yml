name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install toolchain (pinned by rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # The same target run locally, rather than the four commands it happens
      # to expand to today. Spelling them out here meant CI could keep passing
      # a gate the Makefile no longer described — the two agreed only as long
      # as somebody remembered to edit both.
      - run: make

  # The demo is re-recorded by hand (`make demo`), because the render depends on
  # the fonts installed on the machine. CI only plays the tape, to catch one
  # that has stopped working — it never commits a GIF of its own.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install toolchain (pinned by rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # Installed directly rather than via charmbracelet/vhs-action, which
      # hardcodes a search for ffmpeg-n5.1 assets in BtbN/FFmpeg-Builds and
      # fails now that upstream has moved past 5.1.
      - name: Install VHS and its recorder dependencies
        env:
          VHS_VERSION: 0.11.0
          TTYD_VERSION: 1.7.7
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          sudo curl -fsSL -o /usr/local/bin/ttyd \
            "https://github.com/tsl0922/ttyd/releases/download/${TTYD_VERSION}/ttyd.x86_64"
          sudo chmod +x /usr/local/bin/ttyd
          curl -fsSL \
            "https://github.com/charmbracelet/vhs/releases/download/v${VHS_VERSION}/vhs_${VHS_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C /tmp
          sudo install "/tmp/vhs_${VHS_VERSION}_Linux_x86_64/vhs" /usr/local/bin/vhs
          vhs --version
      - run: make demo-check

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Do not add a `macos-13` runner back. GitHub retired that label, and a job
  # asking for it does not fail — it queues until it expires, which held the
  # v0.2.1 release for hours without ever reporting an error.
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # `fetch-depth: 0` is load-bearing: `build.rs` asks `git describe --tags
      # --exact-match`, and a shallow checkout fetches no tags at all.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      # rust-toolchain.toml pins the channel only. This is the one job that
      # cross-compiles, so it is the one job that adds a target.
      - name: Install toolchain (pinned by rust-toolchain.toml)
        run: |
          rustup show
          rustup target add ${{ matrix.target }}
      # Keyed by target: two of these jobs share a runner.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          asset="scriv-${{ matrix.target }}.tar.gz"
          tar -czf "$asset" -C "target/${{ matrix.target }}/release" scriv
          shasum -a 256 "$asset" > "$asset.sha256"
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ env.ASSET }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ASSET }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          if-no-files-found: error

  # One job, one `gh release create`, every asset in that single call. Releases
  # here are immutable — a later `gh release upload` fails — so the matrix
  # cannot publish, only build.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
      # `GH_REPO` because this job has no checkout, and `gh` otherwise resolves
      # the repository by asking git for a remote.
      - name: Publish the release with every asset attached
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          mapfile -t assets < <(find dist -type f | sort)
          # A tarball and a checksum for each of the four targets. An immutable
          # release missing a platform cannot be fixed afterwards.
          [ "${#assets[@]}" -eq 8 ] || {
            printf 'expected 8 assets, found %d:\n' "${#assets[@]}" >&2
            printf '  %s\n' "${assets[@]}" >&2
            exit 1
          }
          gh release create "$GITHUB_REF_NAME" --generate-notes "${assets[@]}"

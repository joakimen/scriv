[toolchain]
channel = "1.96.1"
components = ["rustfmt", "clippy"]

# No `targets`. rustup honours that list only when it first installs the
# toolchain, which is why `release.yml` runs `rustup target add` of its own —
# so the four cross-targets listed here bought nothing, and cost every job that
# is not the release build a standard library per target it never links.

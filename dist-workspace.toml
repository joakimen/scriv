[workspace]
members = ["cargo:."]

# Config for `dist`, which builds every target and publishes the GitHub release
# for a pushed `v*` tag. `.github/workflows/release.yml` is generated from this
# file — never edit it by hand, run `dist init` instead. That command also
# rewrites this file, and keeps only the comments it finds above a key it still
# recognises, so anything explanatory has to sit there.
[dist]
cargo-dist-version = "0.32.0"
ci = "github"
# scriv ships as release binaries only. No installer scripts, no crates.io.
installers = []
# One target, and the crate refuses to build for any other — see the guard in
# `src/proc.rs`. Adding one back is not a line here: it means finding every
# place that assumed Apple Silicon, starting with the signal numbers.
targets = ["aarch64-apple-darwin"]
# A pushed `v*` tag is the whole trigger, which is what every other Rust CLI
# does. `cargo release` writes the version, the tag and the push as one command,
# so the tag cannot be the step someone forgets.
dispatch-releases = false
# `.tar.gz`, not dist's default `.tar.xz`: the README's install line resolves
# these assets through mise, and the extension is part of that contract.
unix-archive = ".tar.gz"
# Build provenance, as the hand-written workflow attested before it.
github-attestations = true
# build.rs decides `scriv --version` by asking git whether HEAD is tagged, which
# a shallow dist checkout cannot answer. This tells it what it cannot observe.
# Relative to `.github/workflows/`, and deliberately above it: a bare step list
# sitting among the workflows is a workflow GitHub cannot parse.
github-build-setup = "../build-setup.yml"

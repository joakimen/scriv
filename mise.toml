#:schema https://mise.jdx.dev/schema/mise.json
# The development tools nothing else here installs. Rust is absent because
# rust-toolchain.toml pins it and rustup reads that file directly, and vhs is
# absent because mise has no macOS build of the ttyd it shells out to — half a
# recorder pinned in a second place is worse than the `brew install vhs` that
# CLAUDE.md already names.
#
# cargo-release bumps the version and does nothing else. It runs in
# `release-prepare.yml`, not here — mise-action installs the pin below, so the
# version that cuts a release is the version in this file. dist owns the rest of
# a release and pins itself in dist-workspace.toml for CI; the entry below is
# for running `dist init` by hand, and the two must be bumped together.

[tools]
prek = "0.4.11"
cargo-release = "1.1.2"
cargo-dist = "0.32.0"
